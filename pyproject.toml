# Makes the tools installable, so that .mcp.json can start them with 'python -m ollmcp_tools' instead of a path.
# Install once with: python -m pip install -e <path to this repository>
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ollmcp-tools"
version = "0.1.0"
description = "MCP tools for AI-driven development with small local models in ollmcp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x provides MCPServer, which the toolsets are built on
    "mcp>=2.1,<3",
    # The web toolset
    "ollama>=0.6",
    # JS/TS outlines. Pinned to one minor version each, as the grammars must match the tree-sitter version and its API changes between versions
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[tool.setuptools]
packages = ["ollmcp_tools"]
